<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LIMBO — Official Links</title>
  <meta name="description" content="All official LIMBO channels across YouTube, TikTok, Instagram, and Facebook." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0a0a;
      --bg-elevated: #161313;
      --card: rgba(25, 21, 21, 0.86);
      --card-hover: rgba(38, 30, 30, 0.96);
      --border: rgba(240, 232, 218, 0.11);
      --border-hover: rgba(200, 35, 26, 0.65);
      --parchment: #f0e8da;
      --muted: #a69c92;
      --crimson: #c8231a;
      --crimson-glow: rgba(200, 35, 26, 0.28);
      --radius-lg: 20px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--parchment);
      display: flex;
      justify-content: center;
      padding: 36px 18px 48px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle atmospheric crimson vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% -10%, rgba(200, 35, 26, 0.22), transparent 55%),
        radial-gradient(circle at 85% 95%, rgba(200, 35, 26, 0.10), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header / Brand */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 30px;
      width: 100%;
    }

    .avatar-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--crimson), #5e110c 55%, rgba(240, 232, 218, 0.35));
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65), 0 0 28px var(--crimson-glow);
      margin-bottom: 16px;
      transition: transform 0.3s ease;
    }

    .avatar-ring:hover {
      transform: scale(1.03);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: var(--parchment);
    }

    .brand-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--parchment);
      line-height: 1.1;
    }

    .brand-title span {
      color: var(--crimson);
    }

    .brand-subtitle {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--muted);
      max-width: 340px;
      line-height: 1.45;
    }

    /* View container */
    .views {
      width: 100%;
      position: relative;
    }

    .view {
      width: 100%;
      display: none;
      animation: fadeSlideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 14px;
      text-align: center;
    }

    /* Network Cards (Home View) */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 13px;
      width: 100%;
    }

    .network-btn {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      color: var(--parchment);
      text-align: left;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .network-btn:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(200, 35, 26, 0.25);
    }

    .network-btn:active {
      transform: translateY(0) scale(0.99);
    }

    .net-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .net-icon-wrap svg {
      width: 24px;
      height: 24px;
      display: block;
    }

    .net-info {
      flex: 1;
      min-width: 0;
    }

    .net-name {
      font-size: 1.06rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .net-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(200, 35, 26, 0.18);
      color: #ff6b63;
      border: 1px solid rgba(200, 35, 26, 0.35);
    }

    .badge.soon {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .chevron {
      width: 20px;
      height: 20px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .network-btn:hover .chevron {
      transform: translateX(3px);
      color: var(--parchment);
    }

    /* Channel Detail View */
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--parchment);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(240, 232, 218, 0.28);
    }

    .active-network-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--parchment);
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(200, 35, 26, 0.14);
      border: 1px solid rgba(200, 35, 26, 0.35);
    }

    .active-network-pill svg {
      width: 17px;
      height: 17px;
    }

    .channel-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: var(--parchment);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .channel-card:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .channel-card.disabled {
      opacity: 0.68;
    }

    .channel-card.disabled:hover {
      transform: none;
      border-color: var(--border);
    }

    .channel-logo {
      width: 62px;
      height: 62px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--parchment);
      border: 1px solid rgba(240, 232, 218, 0.25);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .channel-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--parchment);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .channel-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .channel-handle {
      font-size: 0.76rem;
      color: #d97a74;
      margin-top: 4px;
      font-weight: 500;
    }

    .external-icon {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .channel-card:hover .external-icon {
      color: var(--parchment);
      transform: translate(2px, -2px);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f1919;
      border: 1px solid rgba(200, 35, 26, 0.5);
      color: var(--parchment);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 50;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 38px;
      font-size: 0.76rem;
      color: rgba(166, 156, 146, 0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>

    // =========================================================================
    // 3. MOTEUR D'INTERFACE
    // =========================================================================
    const mainAvatar = document.getElementById("main-avatar");
    const viewNetworks = document.getElementById("view-networks");
    const viewChannels = document.getElementById("view-channels");
    const networkList = document.getElementById("network-list");
    const channelList = document.getElementById("channel-list");
    const activePill = document.getElementById("active-network-pill");
    const backBtn = document.getElementById("back-btn");
    const toastEl = document.getElementById("toast");

    mainAvatar.src = LOGOS.main;

    let toastTimer = null;
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function renderNetworks() {
      networkList.innerHTML = "";
      NETWORKS.forEach((net) => {
        const activeCount = net.channels.filter((c) => c.url && c.url.trim() !== "").length;
        const badgeHtml = activeCount > 0
          ? `<span class="badge">${activeCount} channels</span>`
          : `<span class="badge soon">Soon</span>`;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "network-btn";
        btn.innerHTML = `
          <div class="net-icon-wrap">${net.icon}</div>
          <div class="net-info">
            <div class="net-name">${net.name} ${badgeHtml}</div>
            <div class="net-meta">${net.subtitle}</div>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        `;
        btn.addEventListener("click", () => openNetwork(net.id));
        networkList.appendChild(btn);
      });
    }

    function openNetwork(networkId) {
      const net = NETWORKS.find((n) => n.id === networkId);
      if (!net) return;

      activePill.innerHTML = `${net.icon} <span>${net.name}</span>`;
      channelList.innerHTML = "";

      net.channels.forEach((ch) => {
        const hasUrl = Boolean(ch.url && ch.url.trim() !== "");
        const el = document.createElement(hasUrl ? "a" : "button");
        el.className = "channel-card" + (hasUrl ? "" : " disabled");

        if (hasUrl) {
          el.href = ch.url;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
        } else {
          el.type = "button";
          el.addEventListener("click", () => showToast(`${ch.name} on ${net.name} — Coming soon`));
        }

        el.innerHTML = `
          <div class="channel-logo">
            <img src="${ch.logo}" alt="${ch.name} logo" />
          </div>
          <div class="channel-info">
            <div class="channel-name">
              ${ch.name}
              ${hasUrl ? "" : '<span class="badge soon">Soon</span>'}
            </div>
            <div class="channel-desc">${ch.desc}</div>
            <div class="channel-handle">${ch.handle}</div>
          </div>
          <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        `;
        channelList.appendChild(el);
      });

      viewNetworks.classList.remove("active");
      viewChannels.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    backBtn.addEventListener("click", () => {
      viewChannels.classList.remove("active");
      viewNetworks.classList.add("active");
    });

    renderNetworks();
  </script>
